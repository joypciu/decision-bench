{% extends "base.html" %}
{% block title %}New bot · Decision Bench{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <p class="eyebrow">New bot</p>
    <h1>Define the worker.</h1>
  </div>
</header>
{% if error %}<p class="banner">{{ error }}</p>{% endif %}
<form class="panel form" method="post" action="/bots" id="bot-form">
  {% include "bot_fields.html" %}
  <button class="button" type="submit">Save bot</button>
</form>
<script id="pack-data" type="application/json">{{ pack_options | tojson }}</script>
<script src="/static/app.js"></script>
{% endblock %}
