<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Decision Bench{% endblock %}</title>
  <script>
    (function () {
      var saved = localStorage.getItem("decision-bench-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Fraunces:opsz,wght@9..144,560;9..144,640&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="mark" href="/"><span class="mark-badge">DB</span> Decision Bench</a>
      <nav>
        <a class="{% if active == 'home' %}active{% endif %}" href="/">Runs</a>
        <a class="{% if active == 'bots' %}active{% endif %}" href="/bots">Bots</a>
        <a class="{% if active == 'packs' %}active{% endif %}" href="/packs">Packs</a>
        <a class="{% if active == 'evals' %}active{% endif %}" href="/evals">Evals</a>
        <a class="{% if active == 'settings' %}active{% endif %}" href="/settings">Settings</a>
      </nav>
      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-value="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
      </div>
    </header>
    <div class="readybar">
      <span class="label">Ready</span>
      {% for provider in provider_rows if provider.configured %}
      <span class="chip">{{ provider.name }}</span>
      {% endfor %}
    </div>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
