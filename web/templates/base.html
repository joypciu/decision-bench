<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Decision Bench{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Source+Sans+3:wght@400;550;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="mark" href="/">Decision Bench</a>
      <p class="rail-note">Structured decisions, spawned sub-agents, scored runs.</p>
      <nav>
        <a class="{% if active == 'home' %}active{% endif %}" href="/">Runs</a>
        <a class="{% if active == 'bots' %}active{% endif %}" href="/bots">Bots</a>
        <a class="{% if active == 'packs' %}active{% endif %}" href="/packs">Packs</a>
        <a class="{% if active == 'evals' %}active{% endif %}" href="/evals">Evals</a>
      </nav>
      <ul class="providers">
        {% for provider in provider_rows %}
        <li>
          <span class="dot {% if provider.configured %}on{% endif %}"></span>
          <span>{{ provider.name }}</span>
        </li>
        {% endfor %}
      </ul>
    </aside>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
