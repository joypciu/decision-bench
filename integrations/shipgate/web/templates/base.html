<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shipgate{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/modern.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span>SG</span> Shipgate</a>
    <p>One review per commit. Ship, revise, or block.</p>
    <div class="status">
      <a class="ghost" href="/history">Review history</a>
      <span class="pill on">{{ provider }} ready</span>
      <span class="pill {{ 'on' if github_app else 'off' }}">GitHub app {{ 'connected' if github_app else 'not set' }}</span>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
