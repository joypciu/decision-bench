name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: joypciu/decision-bench
          path: decision-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e decision-bench
          pip install -e ".[dev]"
      - name: Test
        env:
          DECISION_BENCH_ROOT: ${{ github.workspace }}/decision-bench
        run: pytest
