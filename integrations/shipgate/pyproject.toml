[project]
name = "shipgate"
version = "0.1.0"
description = "GitHub App that posts one ship, revise, or block review per pull request commit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "PyJWT>=2.9",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
shipgate = "shipgate.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
